[pytest]
# Scope test discovery to tests/ only. Without this, pytest's default
# discovery pattern (test_*.py / *_test.py) would sweep up ANY matching
# file anywhere in the project root — which is exactly what broke the mock
# test suite once during development (a root-level integration-check script
# got collected and its module-level env var mutation leaked into every
# other test). Keeping discovery scoped here is cheap insurance against
# that happening again.
testpaths = tests
